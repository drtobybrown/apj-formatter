[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apj-formatter"
version = "0.1.0"
description = "Publication-ready matplotlib styling and formatting targeted for the Astrophysical Journal (ApJ / AAS Journals)"
readme = "README.md"
authors = [
    { name = "Toby Brown", email = "Tobias.Brown@nrc-cnrc.gc.ca" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/drtobybrown/apj-formatter"
Repository = "https://github.com/drtobybrown/apj-formatter"

[tool.setuptools.packages.find]
where = ["src"]
